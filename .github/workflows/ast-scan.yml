name: Traceable AST Scan

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ast-scan:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pick a free port for crAPI
        run: |
          PORT=$(shuf -i 3000-9000 -n 1)
          echo "CRAPI_PORT=$PORT" >> $GITHUB_ENV

      - name: Start crAPI
        run: CRAPI_PORT=${{ env.CRAPI_PORT }} docker compose -f crapi/docker-compose.yml up -d

      - name: Debug - wait and inspect crAPI
        run: |
          sleep 30
          echo "=== Docker container status ==="
          docker ps -a
          echo "=== Port bindings ==="
          docker port crapi-web
          echo "=== curl verbose on /health ==="
          curl -v http://localhost:${{ env.CRAPI_PORT }}/health || true
          echo "=== curl on / ==="
          curl -v http://localhost:${{ env.CRAPI_PORT }}/ || true
          echo "=== crapi-web logs ==="
          docker logs crapi-web --tail 50

